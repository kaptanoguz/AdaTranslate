name: Build AdaTranslate (Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm deps
        run: npm install

      - name: Build Tauri Windows (nsis + msi)
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis,msi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AdaTranslate-Windows
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*
