name: Release

# A version tag (v2.0.0) or "Run workflow" builds the Windows portable/zip and the
# Linux AppImage with the translation models and publishes them as a GitHub release.
# Pull requests that touch the build only check that it still builds.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json
      - package-lock.json
      - electron-main.js

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win --x64
            files: |
              dist-desktop/*.exe
              dist-desktop/*.zip
          - os: ubuntu-latest
            target: --linux AppImage
            files: dist-desktop/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Cache translation models
        uses: actions/cache@v4
        with:
          path: models/*/onnx
          key: opus-mt-onnx-${{ hashFiles('tools/get_models.sh') }}
      - run: bash tools/get_models.sh
      - name: Verify
        if: runner.os == 'Linux'
        run: bash dogrula.sh
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: build-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  release:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ada Translate ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: out/*
