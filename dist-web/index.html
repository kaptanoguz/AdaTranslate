<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ada Translate</title>
<meta name="theme-color" content="#0A1929">
<meta name="description" content="Offline İngilizce ↔ Türkçe denizcilik sözlüğü">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <svg class="anchor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 0v16M7 10h10M4 15a8 8 0 0 0 16 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <div class="brand-text">
      <span class="brand-name">ADA TRANSLATE</span>
      <span class="brand-sub">MARINE LEXICON · EN ↔ TR</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="coord" id="coord">41°00′N 029°00′E</span>
  </div>
</header>

<main>
  <p class="eyebrow" id="status">veri yükleniyor…</p>

  <div class="searchwrap">
    <label class="visually-hidden" for="q">Terim ara</label>
    <div class="searchbox">
      <svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="İngilizce ya da Türkçe terim yazın… (EN ↔ TR)">
      <span class="dirpill" id="dirpill" hidden>EN → TR</span>
      <button id="clear" class="clear" title="Temizle" aria-label="Temizle" hidden>×</button>
    </div>
    <div class="underline"></div>
    <p class="kbd-hint"><kbd>/</kbd> ara · <kbd>ESC</kbd> temizle</p>
  </div>

  <nav class="chips" id="chips" aria-label="Kategori filtreleri"></nav>

  <nav class="views" aria-label="Görünüm">
    <button class="viewbtn active" data-view="search">ARAMA</button>
    <button class="viewbtn" data-view="abbr">KISALTMALAR</button>
    <button class="viewbtn" data-view="az">A–Z</button>
    <button class="viewbtn" data-view="fav">FAVORİLER</button>
    <button class="viewbtn" data-view="quiz">FLASHCARD</button>
  </nav>

  <div class="metarow">
    <span id="count" class="mono">—</span>
    <span class="mono dim" id="sortinfo">SIRALAMA: İLGİ</span>
  </div>

  <section id="recents" class="recents" hidden></section>
  <section id="azindex" class="azindex" hidden></section>
  <section id="results" class="results" aria-live="polite"></section>
  <section id="quiz" class="quiz" hidden></section>
</main>

<footer class="footer">
  <span class="mono">ADA TRANSLATE · TÜM VERİLER CİHAZDA</span>
  <button id="export" class="linkbtn mono">JSON DIŞA AKTAR</button>
</footer>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<button id="totop" class="totop" title="Yukarı çık" aria-label="Yukarı çık">↑</button>

<script src="js/data-bundle.js"></script>
<script src="js/db.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
